name: Secrets Management Demonstration

on:
  workflow_dispatch:

permissions: {}

jobs:
  demonstrate-secret:
    name: Verify GitHub Secret injection
    runs-on: ubuntu-latest
    steps:
      - name: Check secret presence without disclosure
        shell: bash
        env:
          MEMBER3_DEMO_SECRET: ${{ secrets.MEMBER3_DEMO_SECRET }}
        run: |
          if [ -z "$MEMBER3_DEMO_SECRET" ]; then
            echo "Required demonstration secret is missing."
            exit 1
          fi
          echo "GitHub Secret received successfully."
