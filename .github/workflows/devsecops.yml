name: DevSecOps Security Pipeline

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  secrets-scan:
    name: Secrets Scan (Gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout source and history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install verified Gitleaks
        shell: bash
        env:
          GITLEAKS_VERSION: '8.30.1'
          GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
        run: |
          install_dir="$RUNNER_TEMP/gitleaks"
          mkdir -p "$install_dir"
          archive="$install_dir/gitleaks.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$install_dir" gitleaks
          "$install_dir/gitleaks" version

      - name: Scan reachable Git history
        shell: bash
        run: |
          # Include root and merge patches throughout HEAD's ancestry.
          "$RUNNER_TEMP/gitleaks/gitleaks" git --redact=100 --exit-code=1 --log-opts="--full-history --root -m --no-textconv --no-ext-diff HEAD" .

  build-and-test:
    name: Build and Test
    needs: secrets-scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Build application
        run: npm run build

      - name: SAST - Semgrep
        run: |
          python -m pip install semgrep
          semgrep scan --config auto --error .
