services:
  juice-shop:
    build: .
    container_name: juice-shop-compose
    environment:
      ALCHEMY_API_KEY: "${ALCHEMY_API_KEY:-}"
      LLM_API_KEY: "${LLM_API_KEY:-}"
      SOLUTIONS_WEBHOOK: "${SOLUTIONS_WEBHOOK:-}"
      CTF_KEY: "${CTF_KEY:-}"
    ports:
      - "127.0.0.1:3000:3000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
